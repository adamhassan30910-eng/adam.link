name: Update latest YouTube video

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Fetch latest normal YouTube video
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          channel_url = 'https://www.youtube.com/@a.hardware/videos'

          result = subprocess.run(
              [
                  'yt-dlp',
                  '--flat-playlist',
                  '--playlist-end', '10',
                  '--print', '%(id)s|%(title)s|%(webpage_url)s',
                  channel_url
              ],
              capture_output=True,
              text=True,
              check=True
          )

          lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]

          if not lines:
              raise SystemExit('No YouTube videos found.')

          video_id = None
          title = None
          video_url = None

          for line in lines:
              parts = line.split('|', 2)

              if len(parts) != 3:
                  continue

              candidate_id, candidate_title, candidate_url = parts

              # Ignore Shorts
              if '/shorts/' in candidate_url:
                  continue

              video_id = candidate_id
              title = candidate_title
              video_url = candidate_url
              break

          if not video_id or not title:
              raise SystemExit('No normal YouTube video found.')

          data = {
              'channelId': 'UCqtenxu6OfFK3LvNO0wm0yQ',
              'videoId': video_id,
              'title': title,
              'thumbnail': f'https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg',
              'url': video_url,
              'publishedAt': None
          }

          Path('latest-video.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print(f'Updated latest normal video: {title} ({video_id})')
          PY

      - name: Commit updated video data when changed
        run: |
          if git diff --quiet -- latest-video.json; then
            echo 'Latest video has not changed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add latest-video.json
          git commit -m 'Update latest YouTube video'
          git push
